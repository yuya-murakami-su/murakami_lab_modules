[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murakami_lab_modules"
version = "1.1.0"
description = "A PyTorch-based toolkit for neural-network fitting and PINN-style regularization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Yuya Murakami", email = "murakami.yuhya@cii.shizuoka.ac.jp"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "torch>=2.0.0",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.9.0",
]
test = [
  "pytest>=8.0.0",
]
dev = [
  "build>=1.2.0",
  "matplotlib>=3.9.0",
  "pytest>=8.0.0",
  "twine>=5.0.0",
]
all = [
  "matplotlib>=3.9.0",
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/yuya-murakami-su/murakami_lab_modules"
Repository = "https://github.com/yuya-murakami-su/murakami_lab_modules"

[tool.setuptools.packages.find]
include = ["murakami_lab_modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
